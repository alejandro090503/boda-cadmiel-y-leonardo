<section id="itinerary" aria-label="Itinerario">

      <polyline class="itx-track" id="itxTrack"/>
      <polyline class="itx-t1" id="itxT1"/>

      <polyline class="itx-t3" id="itxT3"/>

    <i class="itx-head" id="itxHead" aria-hidden="true"><b></b></i>

    <ol class="itx-list">
      <li class="itx-row itx-l itx-rv">
        <div class="itx-h"><span class="itx-n">2:00</span><span class="itx-m">PM</span></div>
        <span class="itx-dot" aria-hidden="true"></span>
        <div class="itx-t">
          <svg class="itx-ico" viewBox="0 0 48 48" aria-hidden="true">

        </div>
      </li>
      <li class="itx-row itx-r itx-rv">
        <div class="itx-h"><span class="itx-n">3:50</span><span class="itx-m">PM</span></div>
        <span class="itx-dot" aria-hidden="true"></span>
