<section id="dresscode" aria-label="Código de vestimenta">
  <span class="dcx-lbl dcx-rv">Vestimenta</span>
  <h2 class="dcx-title dcx-rv">Código de vestimenta</h2>
  <p class="dcx-formal dcx-rv">Formal 100%</p>
  <div class="dcx-rule dcx-rv" aria-hidden="true"><i></i><b></b><i></i></div>

  <div class="dcx-figs">
    <figure class="dcx-fig dcx-rv" style="--d:0s">
      <div class="dcx-lev">
        <img src="caballero.png" width="300" height="610" alt="Ilustración de traje formal para caballeros" decoding="async">
      </div>
      <figcaption>
        <span class="dcx-role">Caballeros</span>
        <span class="dcx-desc">Traje formal</span>
      </figcaption>
    </figure>
    <figure class="dcx-fig dcx-rv" style="--d:-2.6s">
      <div class="dcx-lev">
        <img src="dama.png" width="248" height="604" alt="Ilustración de vestido largo formal para damas" decoding="async">
      </div>
      <figcaption>
        <span class="dcx-role">Damas</span>
        <span class="dcx-desc">Vestido largo</span>
      </figcaption>
    </figure>
  </div>

  <div class="dcx-colors dcx-rv">
    <h3 class="dcx-sub"><i aria-hidden="true"></i><span>Colores a evitar</span><i aria-hidden="true"></i></h3>
    <ul class="dcx-balls" aria-label="Colores a evitar">
      <li class="dcx-sw is-light" style="--i:0;--c:#FFFFFF;--sw:rgba(217,195,160,.85)">
        <span class="dcx-ball" aria-hidden="true"></span><span class="dcx-name">Blanco</span>
      </li>
      <li class="dcx-sw" style="--i:1;--c:#011d57;--sw:rgba(255,255,255,.38)">
        <span class="dcx-ball" aria-hidden="true"></span><span class="dcx-name">Azul marino</span>
      </li>
    </ul>
    <p class="dcx-note">Gracias por evitar estos tonos el día de la boda.</p>

    <h3 class="dcx-sub dcx-sub2"><i aria-hidden="true"></i><span>Colores sugeridos</span><i aria-hidden="true"></i></h3>
    <p class="dcx-note">A tu elección</p>
  </div>
</section>
